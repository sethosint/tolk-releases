<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tolk — оплата в Telegram</title>
<meta name="theme-color" content="#f3f0e9">
<link rel="icon" href="img/favicon.png">
<script>
  (function () { try { var t = localStorage.getItem("tolk-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=32">
</head>
<body>
<!-- Оплата теперь только в Telegram-боте. Старые версии Tolk (2.9) открывают эту страницу с кодом компьютера и «watch»:
     она создаёт ссылку в бота — ключ всё равно придёт в программу сам. -->
<header class="nav solid"><div class="wrap"><a class="logo" href="./"><img src="img/icon.png" alt="" width="28" height="28">Tolk</a></div></header>
<main class="page">
  <div class="wrap">
    <span class="mono muted" id="kick">Оплата в Telegram</span>
    <h1 id="title">Открываем бота Tolk…</h1>
    <p class="lede" id="text">Покупка, продление и часы Tolk AI — в нашем Telegram-боте @TolkShopBot. Ключ придёт в чат, а Tolk на этом компьютере активируется сам.</p>
    <p style="margin-top:34px"><a class="btn btn-main" id="go" href="https://t.me/TolkShopBot">Открыть Telegram</a></p>
  </div>
</main>
<script>
(function () {
  "use strict";
  var T = {
    uk: ["Оплата в Telegram", "Відкриваємо бота Tolk…", "Купівля, продовження й години Tolk AI — у нашому Telegram-боті @TolkShopBot. Ключ прийде в чат, а Tolk на цьому комп'ютері активується сам.", "Відкрити Telegram"],
    sk: ["Platba v Telegrame", "Otvárame bota Tolk…", "Nákup, predĺženie aj hodiny Tolk AI — v našom Telegram bote @TolkShopBot. Kľúč príde do chatu a Tolk sa na tomto počítači aktivuje sám.", "Otvoriť Telegram"],
    en: ["Pay in Telegram", "Opening the Tolk bot…", "Buying, renewing and Tolk AI hours happen in our Telegram bot, @TolkShopBot. The key arrives in the chat, and Tolk on this computer activates by itself.", "Open Telegram"],
  };
  var q = new URLSearchParams(location.search);
  var lang = q.get("lang");
  if (T[lang]) {
    document.documentElement.lang = lang;
    ["kick", "title", "text", "go"].forEach(function (id, i) { document.getElementById(id).textContent = T[lang][i]; });
  }
  var go = document.getElementById("go");
  var shop = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.port === "8787"
    ? location.origin : "https://tolk-shop.seth-gamingmain.workers.dev";
  var m = q.get("m"), w = q.get("w");
  if (!m) { location.replace(go.href); return; }
  fetch(shop + "/api/handoff", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ machine: m, watch: w, intent: q.get("tab") === "hours" ? "hours" : "buy", lang: lang }),
  }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.url) { go.href = d.url; location.replace(d.url); }
  }).catch(function () { /* бот без кода компьютера — ключ введут вручную */ });
})();
</script>
</body>
</html>

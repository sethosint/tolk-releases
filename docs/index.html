<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tolk — живой перевод всего, что звучит на компьютере</title>
<meta name="description" content="Субтитры с переводом поверх любых окон: созвоны, видео, стримы и игры. Распознавание речи прямо на вашем компьютере, перевод со сленгом.">
<meta property="og:title" content="Tolk — живой перевод всего, что звучит на компьютере">
<meta property="og:description" content="Субтитры с переводом поверх любых окон: созвоны, видео, стримы и игры.">
<meta property="og:image" content="img/ru/look.jpg">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d; --bg2: #121216; --card: rgba(255,255,255,.035); --line: rgba(255,255,255,.08);
    --text: #f5f1e8; --text2: #b9b4aa; --text3: #7d786f;
    --gold-a: #f1e2bf; --gold-b: #d6b882; --gold-c: #a9824c; --ok: #7fd4a8;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(900px 500px at 75% -10%, rgba(214,184,130,.10), transparent 60%),
                      radial-gradient(700px 400px at 0% 20%, rgba(214,184,130,.05), transparent 60%);
    background-repeat: no-repeat;
  }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .gold { background: linear-gradient(180deg, var(--gold-a), var(--gold-b) 55%, var(--gold-c));
          -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* шапка */
  header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px);
           background: rgba(11,11,13,.72); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  nav { display: flex; gap: 22px; margin-left: 18px; }
  nav a { color: var(--text2); text-decoration: none; font-size: 14px; }
  nav a:hover { color: var(--text); }
  .spacer { flex: 1; }
  .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
  .langs button { background: none; border: 0; color: var(--text3); font: 600 12px Inter, sans-serif;
                  padding: 6px 9px; border-radius: 7px; cursor: pointer; }
  .langs button.on { background: rgba(255,255,255,.08); color: var(--text); }

  /* кнопки */
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 14px;
         font-weight: 600; text-decoration: none; font-size: 16px; transition: transform .15s, box-shadow .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.gold-btn { color: #1b150c; background: linear-gradient(180deg, var(--gold-a), var(--gold-b) 60%, var(--gold-c));
                  box-shadow: 0 10px 30px rgba(214,184,130,.22), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.glass { color: var(--text); border: 1px solid var(--line); background: rgba(255,255,255,.04); }
  .btn.glass:hover { border-color: rgba(214,184,130,.35); background: rgba(255,255,255,.06); }
  .btn.gold-btn { position: relative; overflow: hidden; }
  .btn.gold-btn:after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
                        background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
                        transform: skewX(-18deg); transition: none; }
  .btn.gold-btn:hover:after { left: 130%; transition: left .8s ease; }
  .btn.gold-btn:hover { box-shadow: 0 14px 40px rgba(214,184,130,.32), inset 0 1px 0 rgba(255,255,255,.5); }

  /* проявление при прокрутке */
  .rv { opacity: 0; transform: translateY(18px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* подсветка карточки за курсором */
  .card { position: relative; overflow: hidden; transition: border-color .3s, transform .3s; }
  .card:before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
                 background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 0%), rgba(214,184,130,.10), transparent 60%); }
  .card:hover:before { opacity: 1; }
  .card:hover { border-color: rgba(214,184,130,.28); }
  .shot { transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s; }
  .shot:hover { transform: translateY(-4px); box-shadow: 0 26px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(214,184,130,.2); }

  /* золотая рамка тарифа «Навсегда» — медленно бежит по кругу */
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .price.best { border-color: transparent; }
  .price.best:after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
                      background: conic-gradient(from var(--ang), rgba(214,184,130,.15), var(--gold-a), rgba(214,184,130,.15) 35%,
                                  rgba(214,184,130,.15) 60%, var(--gold-b), rgba(214,184,130,.15));
                      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                      -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 8s linear infinite; }
  @keyframes spin { to { --ang: 360deg; } }
  hr.sep { border: 0; height: 1px; margin: 0; background: linear-gradient(90deg, transparent, rgba(214,184,130,.25), transparent); }

  @media (prefers-reduced-motion: reduce) {
    .rv { opacity: 1; transform: none; transition: none; }
    .screen .sun, .bokeh i, .screen .bar-v i, .price.best:after, .live:before { animation: none; }
  }
  .btn svg { width: 18px; height: 18px; }

  /* первый экран */
  .hero { padding-top: 72px; padding-bottom: 40px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
  .overline { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-b); }
  h1 { font-size: clamp(38px, 5.2vw, 64px); line-height: 1.04; margin: 14px 0 18px; letter-spacing: -.02em; }
  .lead { color: var(--text2); font-size: 18px; max-width: 540px; }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; margin: 30px 0 14px; }
  .fine { color: var(--text3); font-size: 13px; }

  /* зерно, как в окнах программы */
  body:after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .045;
               background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* демо субтитров — та же сцена, что в предпросмотре Tolk */
  .screen { position: relative; aspect-ratio: 16/10; border-radius: 22px; overflow: hidden;
            border: 1px solid var(--line); box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset;
            background: linear-gradient(180deg, #121115 0%, #1b191d 48%, #231f22 62%, #0e0d10 100%); }
  .screen .sun { position: absolute; left: 50%; top: 56%; width: 70%; aspect-ratio: 2/1; transform: translate(-50%, -50%);
                 background: radial-gradient(closest-side, rgba(233,196,140,.42), rgba(214,168,110,.14) 55%, transparent);
                 filter: blur(6px); animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .78; transform: translate(-50%, -50%) scale(1.04); } }
  .screen svg.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 52%; }
  .bokeh i { position: absolute; border-radius: 50%; background: rgba(241,226,191,.55);
             box-shadow: 0 0 10px rgba(241,226,191,.6); animation: drift linear infinite; opacity: 0; }
  @keyframes drift { 0% { transform: translateY(10px); opacity: 0; } 15%, 80% { opacity: var(--o, .5); }
                     100% { transform: translateY(-60px); opacity: 0; } }
  .screen .bar-v { position: absolute; left: 4%; right: 4%; bottom: 3.2%; height: 3px; border-radius: 3px;
                   background: rgba(255,255,255,.12); z-index: 3; overflow: hidden; }
  .screen .bar-v i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--gold-c), var(--gold-a));
                     animation: play 38s linear infinite; }
  @keyframes play { to { width: 100%; } }
  .win { position: absolute; top: 14px; left: 16px; display: flex; gap: 6px; z-index: 2; }
  .win i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .sub { position: absolute; left: 7%; right: 7%; bottom: 11%; z-index: 3; padding: 14px 18px 16px;
         border-radius: 14px; background: rgba(13,13,16,.78); border: 1px solid rgba(255,255,255,.08);
         backdrop-filter: blur(6px); box-shadow: 0 12px 34px rgba(0,0,0,.5); min-height: 96px; }
  .sub .o { color: var(--text3); font-size: 14px; min-height: 22px; }
  .sub .t { font-size: clamp(17px, 2.1vw, 22px); font-weight: 600; min-height: 32px; }
  .sub .t span { animation: in .35s ease; }
  @keyframes in { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
  .live { position: absolute; top: 12px; right: 14px; z-index: 2; font-size: 11px; font-weight: 600;
          letter-spacing: .12em; color: var(--ok); display: flex; align-items: center; gap: 6px; }
  .live:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                 box-shadow: 0 0 10px var(--ok); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* секции */
  section { padding: 70px 0; }
  h2 { font-size: clamp(28px, 3.4vw, 40px); margin: 10px 0 14px; letter-spacing: -.01em; }
  .sub-h { color: var(--text2); max-width: 640px; margin-bottom: 34px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .card h3 { margin: 14px 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--text2); font-size: 15px; }
  .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
         background: rgba(214,184,130,.10); border: 1px solid rgba(214,184,130,.25); color: var(--gold-a); }
  .ico svg { width: 20px; height: 20px; }

  .shots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .shot { margin: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--bg2); }
  .shot img { display: block; width: 100%; height: auto; aspect-ratio: 1.49; object-fit: contain; background: #000; }
  .shot figcaption { padding: 12px 16px; color: var(--text2); font-size: 14px; border-top: 1px solid var(--line); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
  .step { position: relative; padding-top: 58px; }
  .step:after { counter-increment: s; content: counter(s); position: absolute; top: 22px; left: 24px;
                 width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
                 font-weight: 700; font-size: 14px; color: #1b150c;
                 background: linear-gradient(180deg, var(--gold-a), var(--gold-c)); }

  .prices { display: grid; grid-template-columns: repeat(2, minmax(0, 360px)); gap: 18px; justify-content: center; }
  .price { text-align: left; padding: 30px; }
  .price.best { border-color: rgba(214,184,130,.55); box-shadow: 0 0 0 1px rgba(214,184,130,.25), 0 30px 70px rgba(0,0,0,.4); }
  .price .name { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-b); }
  .price .sum { font-size: 46px; font-weight: 700; margin: 8px 0 2px; }
  .price .per { color: var(--text3); font-size: 14px; }
  .price ul { list-style: none; padding: 0; margin: 20px 0 24px; }
  .price li { padding: 6px 0 6px 26px; position: relative; color: var(--text2); font-size: 15px; }
  .price li:before { content: "✓"; position: absolute; left: 0; color: var(--gold-b); font-weight: 700; }
  .pay { text-align: center; color: var(--text3); font-size: 14px; margin-top: 22px; }

  .req { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .req .card p { font-size: 14px; }
  .req b { display: block; font-size: 15px; margin-bottom: 4px; }

  details { border: 1px solid var(--line); border-radius: 14px; background: var(--card); margin-bottom: 10px; }
  summary { cursor: pointer; padding: 18px 22px; font-weight: 600; list-style: none; position: relative; }
  summary::-webkit-details-marker { display: none; }
  summary:after { content: "+"; position: absolute; right: 22px; color: var(--gold-b); font-size: 20px; top: 13px; }
  details[open] summary:after { content: "–"; }
  details p { margin: 0; padding: 0 22px 18px; color: var(--text2); }

  .final { text-align: center; padding: 80px 0 90px; }
  footer { border-top: 1px solid var(--line); color: var(--text3); font-size: 14px; padding: 28px 0 40px; }
  footer .wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  footer a { color: var(--text2); }
  .note { color: var(--text3); font-size: 13px; margin-top: 16px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding-top: 40px; }
    .grid, .steps, .req { grid-template-columns: 1fr 1fr; }
    nav { display: none; }
  }
  @media (max-width: 620px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .grid, .steps, .shots, .prices, .req { grid-template-columns: 1fr; }
    section { padding: 52px 0; }
    .langs button { padding: 6px 7px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#"><img src="img/icon.png" alt="">Tolk</a>
    <nav>
      <a href="#features" data-i="nav_features"></a>
      <a href="#how" data-i="nav_how"></a>
      <a href="#pricing" data-i="nav_pricing"></a>
      <a href="#faq" data-i="nav_faq"></a>
    </nav>
    <div class="spacer"></div>
    <div class="langs" id="langs">
      <button data-l="ru">RU</button><button data-l="uk">UA</button><button data-l="sk">SK</button><button data-l="en">EN</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap hero">
    <div>
      <div class="overline" data-i="hero_over"></div>
      <h1><span data-i="hero_h1a"></span><br><span class="gold" data-i="hero_h1b"></span></h1>
      <p class="lead" data-i="hero_lead"></p>
      <div class="cta">
        <a class="btn gold-btn dl" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg>
          <span data-i="cta_download"></span>
        </a>
        <a class="btn glass" href="#pricing" data-i="cta_prices"></a>
      </div>
      <div class="fine" data-i="hero_fine"></div>
    </div>
    <div class="screen" aria-hidden="true">
      <div class="sun"></div>
      <div class="bokeh" id="bokeh"></div>
      <svg class="hills" viewBox="0 0 800 260" preserveAspectRatio="none">
        <defs>
          <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b272c"/><stop offset="1" stop-color="#141216"/></linearGradient>
          <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1a1e"/><stop offset="1" stop-color="#0c0b0d"/></linearGradient>
        </defs>
        <path d="M0 120 C120 70 220 110 330 88 C450 64 560 118 660 92 C730 74 780 86 800 80 L800 260 L0 260Z" fill="url(#h1)"/>
        <path d="M0 170 C140 130 260 168 380 150 C520 128 620 176 800 146 L800 260 L0 260Z" fill="url(#h2)"/>
      </svg>
      <div class="win"><i></i><i></i><i></i></div>
      <div class="live">LIVE</div>
      <div class="sub"><div class="o" id="demo-o"></div><div class="t" id="demo-t"></div></div>
      <div class="bar-v"><i></i></div>
    </div>
  </div>

  <section id="features">
    <div class="wrap">
      <div class="overline" data-i="f_over"></div>
      <h2 data-i="f_h2"></h2>
      <p class="sub-h" data-i="f_sub"></p>
      <div class="grid">
        <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M7 14h10M9 11h6"/></svg></div><h3 data-i="f1_t"></h3><p data-i="f1_p"></p></div>
        <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h3l2-6 4 12 2-6h5"/></svg></div><h3 data-i="f2_t"></h3><p data-i="f2_p"></p></div>
        <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5h10a3 3 0 013 3v5a3 3 0 01-3 3H10l-4 3v-3H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg></div><h3 data-i="f3_t"></h3><p data-i="f3_p"></p></div>
        <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg></div><h3 data-i="f4_t"></h3><p data-i="f4_p"></p></div>
        <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.5L12 15.6 7.1 18.2 8 12.7 4 8.8 9.6 8z"/></svg></div><h3 data-i="f5_t"></h3><p data-i="f5_p"></p></div>
        <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></div><h3 data-i="f6_t"></h3><p data-i="f6_p"></p></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="overline" data-i="s_over"></div>
      <h2 data-i="s_h2"></h2>
      <div class="shots">
        <figure class="shot"><img data-img="look" alt=""><figcaption data-i="s1"></figcaption></figure>
        <figure class="shot"><img data-img="translate" alt=""><figcaption data-i="s2"></figcaption></figure>
        <figure class="shot"><img data-img="ready" alt=""><figcaption data-i="s3"></figcaption></figure>
        <figure class="shot"><img data-img="shop" alt=""><figcaption data-i="s4"></figcaption></figure>
      </div>
    </div>
  </section>

  <hr class="sep">
  <section id="how">
    <div class="wrap">
      <div class="overline" data-i="h_over"></div>
      <h2 data-i="h_h2"></h2>
      <div class="steps">
        <div class="card step"><h3 data-i="h1_t"></h3><p data-i="h1_p"></p></div>
        <div class="card step"><h3 data-i="h2_t"></h3><p data-i="h2_p"></p></div>
        <div class="card step"><h3 data-i="h3_t"></h3><p data-i="h3_p"></p></div>
      </div>
    </div>
  </section>

  <hr class="sep">
  <section id="pricing">
    <div class="wrap">
      <div class="overline" style="text-align:center" data-i="p_over"></div>
      <h2 style="text-align:center" data-i="p_h2"></h2>
      <p class="sub-h" style="margin:0 auto 34px;text-align:center" data-i="p_sub"></p>
      <div class="prices">
        <div class="card price">
          <div class="name" data-i="p_month"></div>
          <div class="sum">5 €</div><div class="per" data-i="p_month_per"></div>
          <ul><li data-i="p_all"></li><li data-i="p_ai"></li><li data-i="p_updates"></li><li data-i="p_renew"></li></ul>
          <a class="btn glass dl" href="#" style="width:100%;justify-content:center" data-i="p_try"></a>
        </div>
        <div class="card price best">
          <div class="name" data-i="p_forever"></div>
          <div class="sum gold">25 €</div><div class="per" data-i="p_forever_per"></div>
          <ul><li data-i="p_all"></li><li data-i="p_ai"></li><li data-i="p_updates"></li><li data-i="p_once"></li></ul>
          <a class="btn gold-btn dl" href="#" style="width:100%;justify-content:center" data-i="p_buy"></a>
        </div>
      </div>
      <p class="pay" data-i="p_pay"></p>
      <p class="pay note" data-i="p_note"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="overline" data-i="r_over"></div>
      <h2 data-i="r_h2"></h2>
      <div class="req">
        <div class="card"><p><b data-i="r1_t"></b><span data-i="r1_p"></span></p></div>

let lang = "ru";
let demoTimer = null;

function detect() {
  try {
    const saved = localStorage.getItem("tolk-lang");
    if (saved && T[saved]) return saved;
  } catch (e) {}
  const list = (navigator.languages || [navigator.language || "en"]).map((l) => String(l).slice(0, 2).toLowerCase());
  for (const l of list) {
    if (l === "uk") return "uk";
    if (l === "ru" || l === "be" || l === "kk") return "ru";
    if (l === "sk" || l === "cs") return "sk";
  }
  return list[0] === "en" ? "en" : "ru";
}

function apply(l) {
  lang = l;
  const d = T[l];
  document.documentElement.lang = l === "uk" ? "uk" : l;
  document.querySelectorAll("[data-i]").forEach((el) => { if (d[el.dataset.i] != null) el.textContent = d[el.dataset.i]; });
  document.querySelectorAll("[data-img]").forEach((el) => { el.src = `img/${l}/${el.dataset.img}.jpg`; el.loading = "lazy"; });
  document.querySelectorAll("#langs button").forEach((b) => b.classList.toggle("on", b.dataset.l === l));
  document.title = `Tolk — ${d.hero_h1a.toLowerCase()} ${d.hero_h1b}`;
  try { localStorage.setItem("tolk-lang", l); } catch (e) {}
  demo();
}

function demo() {
  clearTimeout(demoTimer);
  const lines = T[lang].demo;
  const o = document.getElementById("demo-o"), t = document.getElementById("demo-t");
  let i = 0;
  const play = () => {
    const [orig, tr] = lines[i % lines.length];
    const ow = orig.split(" "), tw = tr.split(" ");
    o.textContent = ""; t.textContent = "";
    let k = 0;
    const step = () => {
      if (k < ow.length) o.textContent = ow.slice(0, k + 1).join(" ");
      const tk = Math.max(0, k - 1);                     // перевод чуть отстаёт — как в жизни
      if (k >= 1 && tk < tw.length) {
        const span = document.createElement("span");
        span.textContent = (tk ? " " : "") + tw[tk];
        t.appendChild(span);
      }
      k++;
      if (k <= Math.max(ow.length, tw.length + 1)) demoTimer = setTimeout(step, 260);
      else { i++; demoTimer = setTimeout(play, 2600); }
    };
    step();
  };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    o.textContent = lines[0][0]; t.textContent = lines[0][1];
    return;
  }
  play();
}

// огоньки в сцене
(function () {
  const box = document.getElementById("bokeh");
  if (!box) return;
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("i");
    const size = 2 + Math.random() * 5;
    s.style.cssText = `left:${Math.random() * 100}%;top:${20 + Math.random() * 55}%;width:${size}px;height:${size}px;` +
      `animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s;--o:${0.2 + Math.random() * 0.5};` +
      (size > 5 ? "filter:blur(2px);" : "");
    box.appendChild(s);
  }
})();

// проявление при прокрутке
(function () {
  const els = document.querySelectorAll("section h2, section .overline, section .sub-h, .card, .shot, .pay, .final h2");
  els.forEach((el) => el.classList.add("rv"));
  if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
  const io = new IntersectionObserver((entries) => entries.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  els.forEach((el, i) => { el.style.transitionDelay = (i % 3) * 70 + "ms"; io.observe(el); });
})();

// подсветка карточек за курсором
document.querySelectorAll(".card").forEach((c) => c.addEventListener("pointermove", (e) => {
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX - r.left) + "px");
  c.style.setProperty("--my", (e.clientY - r.top) + "px");
}));

document.querySelectorAll("a.dl").forEach((a) => { a.href = DOWNLOAD; });
document.querySelectorAll("#langs button").forEach((b) => b.addEventListener("click", () => apply(b.dataset.l)));
apply(detect());

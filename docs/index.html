<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tolk — живой перевод лекций, конференций и созвонов</title>
<meta name="description" content="Субтитры с переводом поверх любых окон: лекции, конференции, созвоны и видео. Одна вкладка браузера или одна программа, нейросеть Tolk AI, распознавание речи прямо на вашем компьютере.">
<meta property="og:title" content="Tolk — живой перевод лекций, конференций и созвонов">
<meta property="og:description" content="Субтитры с переводом поверх любых окон — прямо по ходу речи.">
<meta property="og:image" content="img/ru/look.jpg">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c; --bg2: #111115; --card: rgba(255,255,255,.034); --card2: rgba(255,255,255,.055);
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
    --text: #f5f1e8; --text2: #b9b4aa; --text3: #7d786f;
    --gold-a: #f3e4c2; --gold-b: #d6b882; --gold-c: #a9824c; --ok: #7fd4a8; --err: #ee8c8c;
    --radius: 20px; --ease: cubic-bezier(.2,.7,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
         font: 16px/1.6 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { max-width: 100%; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .gold { background: linear-gradient(180deg, var(--gold-a), var(--gold-b) 55%, var(--gold-c));
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overline { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-b); }
  h1, h2, h3 { letter-spacing: -.02em; }
  h2 { font-size: clamp(30px, 3.8vw, 46px); line-height: 1.08; margin: 12px 0 14px; }
  .sub-h { color: var(--text2); max-width: 660px; margin: 0 0 40px; font-size: 17px; }
  .center { text-align: center; }
  .center .sub-h { margin-left: auto; margin-right: auto; }

  /* --- фон: мягкое золотое сияние, медленно плывёт ---------------------------------------------- */
  .aurora { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; will-change: transform; }
  .aurora i:nth-child(1) { width: 60vw; height: 60vw; left: 45%; top: -30vw; background: radial-gradient(closest-side, rgba(214,184,130,.22), transparent);
                           animation: float1 26s ease-in-out infinite; }
  .aurora i:nth-child(2) { width: 50vw; height: 50vw; left: -15vw; top: 20vh; background: radial-gradient(closest-side, rgba(169,130,76,.14), transparent);
                           animation: float2 32s ease-in-out infinite; }
  .aurora i:nth-child(3) { width: 40vw; height: 40vw; right: -10vw; top: 90vh; background: radial-gradient(closest-side, rgba(243,228,194,.08), transparent);
                           animation: float1 38s ease-in-out infinite reverse; }
  @keyframes float1 { 50% { transform: translate(-6vw, 5vh) scale(1.08); } }
  @keyframes float2 { 50% { transform: translate(7vw, -6vh) scale(.94); } }
  body:after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 200; opacity: .04;
               background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .progress { position: fixed; left: 0; top: 0; height: 2px; width: 100%; z-index: 60; transform-origin: 0 50%; transform: scaleX(0);
              background: linear-gradient(90deg, var(--gold-c), var(--gold-a)); }

  /* --- шапка: прозрачная сверху, стекло при прокрутке ------------------------------------------ */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background .4s, border-color .4s, backdrop-filter .4s;
           border-bottom: 1px solid transparent; }
  header.scrolled { background: rgba(10,10,12,.72); backdrop-filter: blur(16px) saturate(140%); border-bottom-color: var(--line); }
  .bar { display: flex; align-items: center; gap: 18px; height: 70px; transition: height .4s var(--ease); }
  header.scrolled .bar { height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  nav { display: flex; gap: 4px; margin-left: 18px; }
  nav a { color: var(--text2); text-decoration: none; font-size: 14px; padding: 7px 12px; border-radius: 9px; transition: color .2s, background .2s; }
  nav a:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .spacer { flex: 1; }
  .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.02); }
  .langs button { background: none; border: 0; color: var(--text3); font: 600 12px Inter, sans-serif; padding: 6px 9px; border-radius: 8px;
                  cursor: pointer; transition: color .2s, background .2s; }
  .langs button:hover { color: var(--text2); }
  .langs button.on { background: rgba(255,255,255,.09); color: var(--text); }

  /* --- кнопки ------------------------------------------------------------------------------------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; border-radius: 14px; border: 0;
         font: 600 16px Inter, sans-serif; text-decoration: none; cursor: pointer; position: relative; overflow: hidden;
         transition: transform .25s var(--ease), box-shadow .3s, background .3s, border-color .3s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.gold-btn { color: #1b150c; background: linear-gradient(180deg, var(--gold-a), var(--gold-b) 60%, var(--gold-c));
                  box-shadow: 0 10px 30px rgba(214,184,130,.22), inset 0 1px 0 rgba(255,255,255,.55); }
  .btn.gold-btn:hover { box-shadow: 0 16px 44px rgba(214,184,130,.34), inset 0 1px 0 rgba(255,255,255,.55); }
  .btn.gold-btn:after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
                        background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent); transform: skewX(-18deg); }
  .btn.gold-btn:hover:after { left: 130%; transition: left .9s ease; }
  .btn.glass { color: var(--text); border: 1px solid var(--line2); background: rgba(255,255,255,.04); }
  .btn.glass:hover { border-color: rgba(214,184,130,.45); background: rgba(255,255,255,.07); }
  .btn.small { padding: 9px 16px; font-size: 14px; border-radius: 11px; }
  .btn[disabled] { opacity: .5; cursor: default; }

  /* --- появление при прокрутке -------------------------------------------------------------------- */
  .rv { opacity: 0; transform: translateY(26px); filter: blur(6px);
        transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease); }
  .rv.in { opacity: 1; transform: none; filter: none; }

  /* --- первый экран ------------------------------------------------------------------------------- */
  .hero { padding-top: 132px; padding-bottom: 60px; display: grid; grid-template-columns: 1.02fr 1fr; gap: 56px; align-items: center; position: relative; }
  .hero:before { content: ""; position: absolute; inset: 40px 0 -20px; z-index: -1; pointer-events: none; opacity: .5;
                 background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
                 background-size: 56px 56px; -webkit-mask: radial-gradient(60% 60% at 60% 40%, #000, transparent); mask: radial-gradient(60% 60% at 60% 40%, #000, transparent); }
  h1 { font-size: clamp(40px, 5vw, 62px); line-height: 1.02; margin: 16px 0 20px; letter-spacing: -.035em; font-weight: 800; }
  .lead { color: var(--text2); font-size: 18.5px; max-width: 560px; }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; margin: 32px 0 16px; }
  .fine { color: var(--text3); font-size: 13px; }
  .intro > * { opacity: 0; transform: translateY(18px); animation: rise 1s var(--ease) forwards; }
  .intro > :nth-child(2) { animation-delay: .08s; } .intro > :nth-child(3) { animation-delay: .16s; }
  .intro > :nth-child(4) { animation-delay: .24s; } .intro > :nth-child(5) { animation-delay: .32s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* демо субтитров — та же сцена, что в предпросмотре Tolk; наклоняется за курсором */
  .stage { perspective: 1400px; position: relative; opacity: 0; animation: rise 1.2s .2s var(--ease) forwards; transform: translateY(18px); }
  .screen { position: relative; aspect-ratio: 16/10; border-radius: 24px; overflow: hidden; border: 1px solid var(--line2);
            box-shadow: 0 50px 110px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 80px rgba(214,184,130,.08);
            background: linear-gradient(180deg, #121115 0%, #1b191d 48%, #231f22 62%, #0e0d10 100%);
            transform-style: preserve-3d; transition: transform .6s var(--ease); will-change: transform; }
  .screen .sun { position: absolute; left: 50%; top: 56%; width: 70%; aspect-ratio: 2/1; transform: translate(-50%, -50%);
                 background: radial-gradient(closest-side, rgba(233,196,140,.42), rgba(214,168,110,.14) 55%, transparent);
                 filter: blur(6px); animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .78; transform: translate(-50%, -50%) scale(1.05); } }
  .screen svg.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 52%; }
  .bokeh i { position: absolute; border-radius: 50%; background: rgba(241,226,191,.55); box-shadow: 0 0 10px rgba(241,226,191,.6);
             animation: drift linear infinite; opacity: 0; }
  @keyframes drift { 0% { transform: translateY(10px); opacity: 0; } 15%, 80% { opacity: var(--o, .5); } 100% { transform: translateY(-60px); opacity: 0; } }
  .screen .bar-v { position: absolute; left: 4%; right: 4%; bottom: 3.2%; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); z-index: 3; overflow: hidden; }
  .screen .bar-v i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--gold-c), var(--gold-a)); animation: play 38s linear infinite; }
  @keyframes play { to { width: 100%; } }
  .win { position: absolute; top: 14px; left: 16px; display: flex; gap: 6px; z-index: 2; }
  .win i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .sub { position: absolute; left: 7%; right: 7%; bottom: 11%; z-index: 3; padding: 14px 18px 16px; border-radius: 14px;
         background: rgba(13,13,16,.8); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(8px);
         box-shadow: 0 12px 34px rgba(0,0,0,.5); min-height: 96px; transform: translateZ(40px); }
  .sub .o { color: var(--text3); font-size: 14px; min-height: 22px; }
  .sub .t { font-size: clamp(16px, 2vw, 22px); font-weight: 600; min-height: 32px; }
  .sub .t span { animation: wordin .4s ease; }
  @keyframes wordin { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }
  .live { position: absolute; top: 12px; right: 14px; z-index: 2; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--ok);
          display: flex; align-items: center; gap: 6px; }
  .live:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .chip { position: absolute; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px; white-space: nowrap;
          font-size: 13px; font-weight: 600; color: var(--text); background: rgba(22,21,26,.82); border: 1px solid var(--line2);
          backdrop-filter: blur(12px); box-shadow: 0 16px 40px rgba(0,0,0,.45); animation: bob 6s ease-in-out infinite; }
  .chip b { color: var(--gold-a); font-weight: 700; }
  .chip.c1 { left: -26px; top: 20%; } .chip.c2 { right: -18px; top: -16px; animation-delay: -2s; } .chip.c3 { left: 8%; bottom: -18px; animation-delay: -4s; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  /* --- бегущая строка ------------------------------------------------------------------------------ */
  .marquee { padding: 26px 0 8px; }
  .marquee .cap { text-align: center; color: var(--text3); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; }
  .track { overflow: hidden; -webkit-mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .rail { display: flex; gap: 14px; width: max-content; animation: slide 40s linear infinite; }
  .track:hover .rail { animation-play-state: paused; }
  .rail span { padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text2); font-weight: 600; font-size: 15px; white-space: nowrap; }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* --- цифры ----------------------------------------------------------------------------------------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 30px; }
  .stat { padding: 22px 22px 20px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)); }
  .stat .n { font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; letter-spacing: -.03em; }
  .stat .l { color: var(--text2); font-size: 14px; }

  section { padding: 96px 0; position: relative; }
  hr.sep { border: 0; height: 1px; margin: 0; background: linear-gradient(90deg, transparent, rgba(214,184,130,.25), transparent); }

  /* --- карточки ------------------------------------------------------------------------------------ */
  .card { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px;
          transition: border-color .35s, transform .45s var(--ease), background .35s; }
  .card:before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s;
                 background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), rgba(214,184,130,.12), transparent 60%); }
  .card:hover:before { opacity: 1; }
  .card:hover { border-color: rgba(214,184,130,.3); transform: translateY(-3px); }
  .card h3 { margin: 16px 0 8px; font-size: 19px; }
  .card p { margin: 0; color: var(--text2); font-size: 15px; }
  .ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: var(--gold-a);
         background: linear-gradient(180deg, rgba(214,184,130,.16), rgba(214,184,130,.06)); border: 1px solid rgba(214,184,130,.28); }
  .ico svg { width: 21px; height: 21px; }

  .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .bento .card:nth-child(1) { grid-column: span 4; } .bento .card:nth-child(2) { grid-column: span 2; }
  .bento .card:nth-child(3), .bento .card:nth-child(4), .bento .card:nth-child(5) { grid-column: span 2; }
  .bento .card:nth-child(6) { grid-column: span 6; }
  .bento .card:nth-child(1) { display: flex; flex-direction: column; }
  .tabsmock { margin-top: auto; position: relative; top: 20px; margin-bottom: 20px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.25); overflow: hidden; }
  .tabsmock .tb { display: flex; gap: 6px; padding: 10px 10px 0; }
  .tabsmock .tb span { flex: 1; min-width: 0; font-size: 12px; color: var(--text3); padding: 8px 10px; border-radius: 9px 9px 0 0; background: rgba(255,255,255,.03);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; transition: all .5s var(--ease); }
  .tabsmock .tb span.on { color: var(--text); background: rgba(214,184,130,.12); box-shadow: inset 0 1px 0 rgba(214,184,130,.4); }
  .tabsmock .tb span.on:after { content: "ON"; margin-left: auto; font-size: 9px; font-weight: 800; color: #1b150c; background: var(--gold-b); padding: 1px 5px; border-radius: 5px; }
  .tabsmock .body { display: flex; align-items: flex-end; gap: 4px; height: 96px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .tabsmock .body i { flex: 1; height: 100%; border-radius: 3px; background: linear-gradient(180deg, var(--gold-a), var(--gold-c)); opacity: .75; animation: eq 1.1s ease-in-out infinite; transform-origin: bottom; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .pairs { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .pair { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 8px 12px; border-radius: 11px; background: rgba(255,255,255,.03); border: 1px solid var(--line);
          opacity: .35; transform: translateX(-6px); transition: all .6s var(--ease); }
  .pair.on { opacity: 1; transform: none; border-color: rgba(214,184,130,.35); }
  .pair s { text-decoration: none; color: var(--text3); }
  .pair b { color: var(--gold-a); font-weight: 600; margin-left: auto; text-align: right; }
  .langrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .langrow span { font-size: 13px; padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line); color: var(--text2); background: rgba(255,255,255,.02); }

  /* --- шаги: линия дорисовывается при прокрутке ---------------------------------------------------- */
  .steps { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .steps .line { position: absolute; left: 6%; right: 6%; top: 38px; height: 2px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; }
  .steps .line i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, var(--gold-c), var(--gold-a)); }
  .step { padding-top: 76px; background: rgba(12,12,15,.8); }
  .step .num { position: absolute; top: 20px; left: 26px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
               font-weight: 800; color: #1b150c; background: linear-gradient(180deg, var(--gold-a), var(--gold-c)); box-shadow: 0 8px 22px rgba(214,184,130,.28); }

  /* --- галерея -------------------------------------------------------------------------------------- */
  .gtabs { display: flex; gap: 6px; padding: 5px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02); width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 22px; }
  .gtabs button { position: relative; overflow: hidden; background: none; border: 0; color: var(--text2); font: 600 14px Inter, sans-serif; padding: 10px 16px;
                  border-radius: 10px; cursor: pointer; white-space: nowrap; transition: color .25s, background .25s; }
  .gtabs button.on { color: var(--text); background: rgba(255,255,255,.08); }
  .gtabs button i { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(0);
                    background: linear-gradient(90deg, var(--gold-c), var(--gold-a)); }
  .gtabs button.on i { animation: tabfill 6.5s linear forwards; }
  @keyframes tabfill { to { transform: scaleX(1); } }
  .gframe { position: relative; border-radius: 22px; padding: 1px; background: linear-gradient(160deg, rgba(214,184,130,.45), rgba(255,255,255,.06) 40%, rgba(214,184,130,.2));
            box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 90px rgba(214,184,130,.07); }
  .gview { position: relative; border-radius: 21px; overflow: hidden; background: #09090b; aspect-ratio: 1220/820; }
  .gview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transform: scale(1.02); transition: opacity .7s var(--ease), transform 1.2s var(--ease); }
  .gview img.on { opacity: 1; transform: none; }
  .gcap { margin-top: 18px; color: var(--text2); text-align: center; min-height: 26px; transition: opacity .4s; }

  /* --- тарифы -------------------------------------------------------------------------------------- */
  .seg { position: relative; display: inline-flex; padding: 5px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.03); margin: 0 auto 34px; }
  .seg button { position: relative; z-index: 1; background: none; border: 0; color: var(--text2); font: 600 15px Inter, sans-serif; padding: 11px 22px; border-radius: 10px; cursor: pointer; transition: color .3s; }
  .seg button.on { color: var(--text); }
  .seg .knob { position: absolute; top: 5px; bottom: 5px; left: 5px; border-radius: 10px; background: rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
               transition: transform .45s var(--spring), width .45s var(--spring); }
  .plans { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; align-items: stretch; }
  .plans.hours { grid-template-columns: repeat(3, minmax(0, 300px)); justify-content: center; }
  .price { display: flex; flex-direction: column; padding: 26px 22px 22px; }
  .price .name { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-b); display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .price .badge { font-size: 10px; letter-spacing: .08em; padding: 3px 8px; border-radius: 7px; color: #1b150c; background: linear-gradient(180deg, var(--gold-a), var(--gold-b)); }
  .price .sum { font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin: 12px 0 0; line-height: 1.1; }
  .price .per { color: var(--text3); font-size: 13.5px; min-height: 21px; }

  .panel { position: relative; width: 100%; max-width: 560px; max-height: calc(100vh - 40px); overflow: auto; border-radius: 22px; padding: 30px;

  .dots i:after { content: ""; position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--gold-c), var(--gold-a)); transition: transform .5s var(--ease); }
  .dots i.on:after { transform: scaleX(1); }
  .opts { display: grid; gap: 8px; margin-bottom: 18px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255,255,255,.025);
         color: var(--text); font: 500 15px Inter, sans-serif; cursor: pointer; text-align: left; transition: border-color .25s, background .25s, transform .2s; }
  .opt:hover { border-color: var(--line2); }
  .opt.on { border-color: rgba(214,184,130,.6); background: rgba(214,184,130,.08); }

  .req-box { border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.025); padding: 6px 16px; margin-bottom: 16px; }

  .row-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  @keyframes rot { to { transform: rotate(360deg); } }
  .okmark { width: 78px; height: 78px; margin: 4px auto 16px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(closest-side, rgba(214,184,130,.2), transparent);
            border: 2px solid var(--gold-b); animation: pop .6s var(--spring); }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  .code { text-align: center; font: 700 26px "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; color: var(--gold-a); padding: 16px; border-radius: 14px;

  .howto { margin: 0 0 18px; padding: 0; list-style: none; counter-reset: h; }
  .howto li { position: relative; padding: 6px 0 6px 34px; color: var(--text2); font-size: 14.5px; }
  .howto li:before { counter-increment: h; content: counter(h); position: absolute; left: 0; top: 6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;

  .step-in { animation: stepin .5s var(--ease); }

  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 150; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: all .35s var(--ease);

  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .resume { position: fixed; left: 50%; bottom: 20px; z-index: 90; transform: translate(-50%, 120%); transition: transform .5s var(--spring); display: flex; align-items: center; gap: 12px;
            padding: 10px 10px 10px 18px; border-radius: 14px; background: rgba(25,24,28,.92); border: 1px solid rgba(214,184,130,.4); backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0,0,0,.5); font-size: 14px; }
  .resume.on { transform: translate(-50%, 0); }
  .sparks i { position: absolute; left: 50%; top: 40%; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-a); pointer-events: none; animation: spark 1.1s ease-out forwards; }

const fmt = (s, ...a) => a.reduce((acc, x) => acc.replace("%s", x), s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function money(price, cur) {
  let t = String(price);
  if (lang !== "en") t = t.replace(".", ",");
  return t + " " + (cur === "EUR" ? "€" : cur);
}
function hours(h) {
  const mins = Math.round(Number(h) * 60), hh = Math.floor(mins / 60), mm = mins % 60;
  if (!hh) return mm + " " + d().m;
  return hh + " " + d().h + (mm ? " " + mm + " " + d().m : "");
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 2000); }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }

function detect() {
  const saved = load("tolk-lang");
  if (saved && T[saved]) return saved;
  const list = (navigator.languages || [navigator.language || "en"]).map((l) => String(l).slice(0, 2).toLowerCase());
  for (const l of list) {
    if (l === "uk") return "uk";
    if (l === "ru" || l === "be" || l === "kk") return "ru";
    if (l === "sk" || l === "cs") return "sk";
  }
  return list[0] === "en" ? "en" : "ru";
}

function apply(l) {

}

let demoTimer = null;
function demo() {
  clearTimeout(demoTimer);
  const lines = d().demo, o = $("#demo-o"), t = $("#demo-t");
  if (reduced) { o.textContent = lines[0][0]; t.textContent = lines[0][1]; return; }
  let i = 0;
  const play = () => {
    const [orig, tr] = lines[i % lines.length], ow = orig.split(" "), tw = tr.split(" ");
    o.textContent = ""; t.textContent = "";
    let k = 0;
    const step = () => {
      if (k < ow.length) o.textContent = ow.slice(0, k + 1).join(" ");
      const tk = Math.max(0, k - 1);
      if (k >= 1 && tk < tw.length) { const s = document.createElement("span"); s.textContent = (tk ? " " : "") + tw[tk]; t.appendChild(s); }
      k++;
      if (k <= Math.max(ow.length, tw.length + 1)) demoTimer = setTimeout(step, 250);
      else { i++; demoTimer = setTimeout(play, 2600); }
    };
    step();
  };
  play();
}

      <p class="muted" style="font-size:13px">${esc(d().co_code_hint)}</p>
      <div class="row-btns"><button class="btn glass" id="coback">${esc(d().co_back)}</button>
      <button class="btn gold-btn" id="copaid">${esc(d().co_paid)}</button></div>`);
    bindCopy();
    $("#copaid").addEventListener("click", async () => {
      $("#copaid").disabled = true;
      try {
        const r = await fetch(`${SHOP}/api/orders/${o.id}/claim`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: o.token }) });
        if (!r.ok) throw new Error();
        stepWait();
      } catch (e) { $("#copaid").disabled = false; toast(d().co_err); }
    });
  }
  $("#coback").addEventListener("click", stepChoose);
}
function stepWait() {
  co(`${dots(3)}<div class="ring"></div><h3 class="center">${esc(d().co_wait_h)}</h3><p class="muted center">${esc(d().co_wait_p)}</p>
    <div class="row-btns" style="justify-content:center"><button class="btn glass" data-close2>${esc(d().co_close)}</button></div>`);
  $("[data-close2]").addEventListener("click", closeModal);
  CO.t0 = CO.t0 || Date.now();
  poll();
}
async function poll() {
  clearTimeout(CO.timer);
  const o = load("tolk-order");
  if (!o) return;
  try {
    const r = await fetch(`${SHOP}/api/orders/${o.id}?token=${encodeURIComponent(o.token)}`, { cache: "no-store" });
    if (r.status === 404) { store("tolk-order", null); $("#resume").classList.remove("on"); return; }
    const s = await r.json();
    if (s.state === "paid") { store("tolk-order", null); $("#resume").classList.remove("on"); return stepDone(s, o.kind); }
    if (s.state === "rejected") { store("tolk-order", null); $("#resume").classList.remove("on"); return stepError(d().co_rej_p, d().co_rej_h); }
  } catch (e) {}
  const age = Date.now() - (o.t || Date.now());
  CO.timer = setTimeout(poll, age < 180000 ? 5000 : 20000);
}
function stepDone(s, kind) {
  let code = s.voucher || s.key || "";
  if (code && !/^TOLK/i.test(code)) code = "TOLK-" + code;
  const steps = kind === "topup" ? d().co_steps_h : d().co_steps;
  co(`<div class="okmark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3 class="center">${esc(d().co_done_h)}</h3><p class="muted center">${esc(d().co_done_p)}</p>
    <div class="code" id="donecode">${esc(code)}</div>
    <div class="row-btns" style="justify-content:center;margin-bottom:18px"><button class="btn glass small" data-copy="${esc(code)}">${esc(d().co_copy)}</button></div>
    <ol class="howto">${steps.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
    <div class="row-btns"><a class="btn gold-btn" href="${DOWNLOAD}">${esc(d().cta_download)}</a></div>`);
  bindCopy();
  openModal();
  burst();
}
function burst() {
  if (reduced) return;
  const box = document.createElement("div");
  box.className = "sparks";
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("i"), a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 140;
    s.style.setProperty("--dx", Math.cos(a) * r + "px");
    s.style.setProperty("--dy", Math.sin(a) * r + "px");
    s.style.animationDelay = Math.random() * .15 + "s";
    box.appendChild(s);
  }
  $("#panel").appendChild(box);
  setTimeout(() => box.remove(), 1600);
}
function resumeCheck() {
  const o = load("tolk-order");
  if (!o) return;
  if (Date.now() - (o.t || 0) > 48 * 3600 * 1000) { store("tolk-order", null); return; }
  $("#resume").classList.add("on");
  poll();
}
$("#resumeBtn").addEventListener("click", () => { $("#resume").classList.remove("on"); stepWait(); openModal(); });

// --- эффекты ----------------------------------------------------------------------------------------
function spot(c) {
  c.addEventListener("pointermove", (e) => {
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
}
let io = null;
function reveal(els, now) {
  els.forEach((el, i) => { el.classList.add("rv"); el.style.transitionDelay = (i % 5) * 70 + "ms"; });
  if (reduced || !("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
  if (!io) io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
    { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  els.forEach((el) => io.observe(el));
}
function counters() {
  const els = $$(".count");
  const run = (el) => {
    const to = parseFloat(el.dataset.to), dec = +(el.dataset.dec || 0), t0 = performance.now(), dur = 1400;
    const f = (t) => {
      const k = Math.min(1, (t - t0) / dur), v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toFixed(dec).replace(".", lang === "en" ? "." : ",");
      if (k < 1) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  };
  if (reduced || !("IntersectionObserver" in window)) return;
  const o = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { run(e.target); o.unobserve(e.target); } }), { threshold: .6 });
  els.forEach((el) => o.observe(el));
}

(function init() {
  // огоньки в сцене
  const box = $("#bokeh");
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("i"), size = 2 + Math.random() * 5;
    s.style.cssText = `left:${Math.random() * 100}%;top:${20 + Math.random() * 55}%;width:${size}px;height:${size}px;animation-duration:${9 + Math.random() * 10}s;` +
      `animation-delay:${-Math.random() * 18}s;--o:${0.2 + Math.random() * 0.5};` + (size > 5 ? "filter:blur(2px);" : "");
    box.appendChild(s);
  }
  // бегущая строка — два одинаковых ряда, чтобы петля была бесшовной
  $("#rail").innerHTML = [...APPS, ...APPS].map((a) => `<span>${esc(a)}</span>`).join("");
  $("#langrow").innerHTML = LANGS_SHOW.map((a) => `<span>${esc(a)}</span>`).join("");
  // эквалайзер и вкладки в карточке
  $("#eq").innerHTML = Array.from({ length: 34 }, (_, i) => `<i style="animation-delay:${-(i * 97 % 1100) / 1000}s;animation-duration:${0.8 + (i * 37 % 60) / 100}s"></i>`).join("");
  const tabsEls = $$("#tabsmock span");
  let ti = 2;
  const tabTick = () => { tabsEls.forEach((s, k) => s.classList.toggle("on", k === ti % tabsEls.length)); ti++; };
  tabTick();
  if (!reduced) setInterval(tabTick, 2600);
  // наклон демо за курсором
  const stage = $("#stage"), screen = $("#screen");
  if (!reduced && matchMedia("(pointer: fine)").matches) {
    stage.addEventListener("pointermove", (e) => {
      const r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      screen.style.transform = `rotateY(${x * 9}deg) rotateX(${-y * 7}deg)`;
    });
    stage.addEventListener("pointerleave", () => { screen.style.transform = ""; });
    // «магнитные» кнопки
    $$(".magnet").forEach((b) => {
      b.addEventListener("pointermove", (e) => {
        const r = b.getBoundingClientRect();
        b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .12}px, ${(e.clientY - r.top - r.height / 2) * .18}px)`;
      });
      b.addEventListener("pointerleave", () => { b.style.transform = ""; });
    });
  }
  // прокрутка: шапка, полоса прогресса, линия шагов
  const header = $("#top"), prog = $("#progress"), steps = $("#steps"), line = $("#steps .line");
  let ticking = false;
  const onScroll = () => {
    ticking = false;
    const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    header.classList.toggle("scrolled", y > 12);
    prog.style.transform = `scaleX(${h > 0 ? y / h : 0})`;
    const r = steps.getBoundingClientRect(), p = Math.min(1, Math.max(0, (innerHeight * .8 - r.top) / (r.height + innerHeight * .3)));
    line.style.setProperty("--p", p.toFixed(3));
  };
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  addEventListener("resize", knob);
  onScroll();
  $$(".card").forEach(spot);
  reveal($$("section h2, section .overline, section .sub-h, .bento .card, .steps .card, .soon .card, .req .card, .gframe"));
  counters();
  $$("a.dl").forEach((a) => { a.href = DOWNLOAD; });
  $$("#langs button").forEach((b) => b.addEventListener("click", () => apply(b.dataset.l)));
  apply(detect());
  resumeCheck();
})();
</script>
